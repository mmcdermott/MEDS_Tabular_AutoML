name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        backend: ["python", "native"]

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check that the native engine was built
        run: |
          uv run python -c "from MEDS_tabular_automl.native import engine; engine.library()"

      - name: Run tests
        env:
          MEDS_TAB_BACKEND: ${{ matrix.backend }}
        run: |
          uv run pytest -v --doctest-modules --cov=src --ignore=docs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
