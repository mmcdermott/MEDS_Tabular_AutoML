# User inputs
filtered_code_metadata_fp: ${output_dir}/metadata/codes.parquet
allowed_codes: null
min_code_inclusion_count: 10
min_code_inclusion_frequency: null
min_correlation: null
max_by_correlation: null
max_included_codes: null
do_compress: False
# Short windows carry much of the signal (dropping 2h and 12h costs AUROC), while 365d adds little between 30d
# and full. The other supported aggregations (static/mean, value/count, value/sum_sqd) can be added back; they
# did not change held-out AUROC in the feature ablations but cost training time.
window_sizes:
  - "2h"
  - "12h"
  - "1d"
  - "7d"
  - "30d"
  - "full"
aggs:
  - "static/present"
  - "code/count"
  - "code/recency" # 1 / (1 + days since the code's last record); computed over the full history only
  - "value/sum"
  - "value/min"
  - "value/max"

# Resolved inputs
_resolved_codes: ${filter_to_codes:${tabularization.filtered_code_metadata_fp},${tabularization.allowed_codes},${tabularization.min_code_inclusion_count},${tabularization.min_code_inclusion_frequency},${tabularization.max_included_codes}}
