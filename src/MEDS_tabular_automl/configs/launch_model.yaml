defaults:
  - default
  - tabularization: default
  - model_launcher: xgboost
  - override hydra/sweeper: optuna
  - override hydra/callbacks: evaluation_callback
  - override hydra/launcher: joblib
  - _self_

task_name: ???

# Labels of the task, as given to tabularization (<split>/<shard>.parquet)
input_label_dir: ???
# Location of the task's tabularized data (the output of meds-tab-tabularize-static/-time-series)
input_tabularized_cache_dir: ${output_dir}/tabularize
# Location of the task's labels, one row per row of the tabularized data
input_label_cache_dir: ${input_label_dir}
# Where to output the model and cached data
output_model_dir: ???

time_output_model_dir: ${output_model_dir}/${now:%Y-%m-%d_%H-%M-%S}

delete_below_top_k: -1

name: launch_model

prediction_splits:
  - held_out
  - tuning

hydra:
  sweep:
    dir: ${time_output_model_dir}/hydra/
    subdir: "1"
  run:
    dir: ${path.sweep_results_dir}
  sweeper:
    direction: "maximize"
