defaults:
  - default
  - tabularization: default
  - model_launcher: sparsegb
  - override hydra/sweeper: optuna
  - override hydra/callbacks: evaluation_callback
  - override hydra/launcher: joblib
  - _self_

task_name: ???

# Labels of the task, as given to tabularization (<split>/<shard>.parquet). The tabularized data has one
# row per label, in the order of these files.
input_label_dir: ???
# The task's tabularized data (the output of meds-tab-tabularize-static/-time-series)
input_tabularized_dir: ${output_dir}/tabularize
# Where to output the model and cached data
output_model_dir: ???

time_output_model_dir: ${output_model_dir}/${now:%Y-%m-%d_%H-%M-%S}

delete_below_top_k: -1

name: launch_model

prediction_splits:
  - held_out
  - tuning

hydra:
  sweep:
    dir: ${time_output_model_dir}/hydra/
    subdir: "1"
  run:
    dir: ${path.sweep_results_dir}
  sweeper:
    direction: "maximize"
