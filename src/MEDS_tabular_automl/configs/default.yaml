input_dir: ???
output_dir: ???
do_overwrite: False
seed: 1
tqdm: False
worker: 0

# Implementation of meds-tab-tabularize-static and meds-tab-tabularize-time-series: "auto" (the default:
# the C++ engine when it is built and supports the configuration, else Python, with a log line saying why),
# "native" (the C++ engine, or an error) or "python". Both write the same files; see docs/native_backend.md.
# The MEDS_TAB_BACKEND environment variable sets the default.
backend: ${oc.env:MEDS_TAB_BACKEND,auto}
native:
  # Engine and writer threads; null uses every CPU available to the process.
  threads: null

log_dir: ${output_dir}/.logs/
cache_dir: ${output_dir}/.cache

hydra:
  verbose: False
  job:
    name: MEDS_TAB_${name}_${worker}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${log_dir}
  run:
    dir: ${log_dir}
