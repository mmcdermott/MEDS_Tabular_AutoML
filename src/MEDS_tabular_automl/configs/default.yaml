input_dir: ???
output_dir: ???
do_overwrite: False
seed: 1
tqdm: False
worker: 0

# Implementation of meds-tab-tabularize-static and meds-tab-tabularize-time-series: "auto" (the default:
# the C++ engine when it is built and supports the configuration, else Python, with a log line saying why),
# "native" (the C++ engine, or an error) or "python". Both write the same files; see docs/native_backend.md.
# The MEDS_TAB_BACKEND environment variable sets the default.
backend: ${oc.env:MEDS_TAB_BACKEND,auto}
native:
  # Engine and writer threads; null uses every CPU available to the process.
  threads: null

# Train on a reproducible subset of the training split, e.g. for scaling studies (see
# MEDS_tabular_automl/train_subset.py). Tuning and held-out are kept whole. Give every stage (describe,
# tabularize, model) the same train_subset.* overrides and the task's input_label_dir.
train_subset:
  # null: the whole training split. "subjects": n (or a fraction of the) training subjects that have labels,
  # with all their labels. "labels": n (or a fraction of the) training label rows.
  by: null
  n: null
  fraction: null
  # Selection order: sha256("<salt>:<subject_id>") for subjects, sha256("<salt>:<subject_id>:<prediction time
  # in microseconds>") for label rows. With one salt, smaller subsets are inside larger ones.
  salt: "0"

log_dir: ${output_dir}/.logs/
cache_dir: ${output_dir}/.cache

hydra:
  verbose: False
  job:
    name: MEDS_TAB_${name}_${worker}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${log_dir}
  run:
    dir: ${log_dir}
