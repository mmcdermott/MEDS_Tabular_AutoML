# @package _global_
defaults:
  - default
  - _self_

model_launcher:
  _target_: MEDS_tabular_automl.medsboost_model.MedsBoostModel.initialize

  # Drop the columns with fewer than this many nonzero training rows before training (0 or 1 keeps them all).
  min_column_nnz: 0

  # medsboost (MEDS_tabular_automl.medsboost): binary gradient-boosted trees for wide, sparse tabularized data.
  # Needs the compiled library (installed from source with a C++17 compiler and OpenMP).
  model:
    # 0: OMP_NUM_THREADS if set (the joblib launcher sets it to the CPU count / hydra.launcher.n_jobs in each
    # worker), else every available CPU. To run sweep trials one at a time on every CPU, set
    # hydra.launcher.n_jobs=1 and hydra.sweeper.n_jobs=1.
    threads: 0
    max_bin: 15
    num_leaves: 127
    min_child_samples: 50
    lambda_l2: 1.0
    learning_rate: 0.05
    # Rows per tree: GOSS (as in LightGBM) keeps the goss_top share of rows with the largest |gradient| plus a random
    # goss_other share of the rest (up-weighted). With the single-precision histograms, 0.3 / 0.2 trained 22% faster in
    # total than double-precision bagging 0.8 on 10 MIMIC-IV tasks, with the same held-out AUROC. goss_top: 0 uses
    # bagging_fraction instead.
    goss_top: 0.3
    goss_other: 0.2
    bagging_fraction: 0.8
    max_rounds: 1000
    early_stopping: 20
    seed: ${seed}
    min_sum_hessian: 0.001
    # Column sampling: each tree uses one window per (code, aggregation), drawn from `layouts` precomputed layouts
    # (a multiple of 7; 0 draws a fresh sample every `refresh` trees instead).
    layouts: 14
    refresh: 1
    # Columns of each (code, aggregation) slot a tree may use; more than 1 needs layouts: 0.
    slot_k: 1
    # Also write node statistics in the saved model (format version 2): each split's gain, and every node's and
    # leaf's hessian sum and row count (cover). For gain feature importance (MedsBoost.feature_importance("gain"))
    # after reloading it, and exact TreeSHAP from the file. Off: the saved file is the version 1 format that every
    # MEDS-Tab release reads. Does not change training.
    save_stats: false

path:
  model_file_stem: "medsboost"
  model_file_extension: .txt

hydra:
  sweeper:
    params:
      model_launcher.model.learning_rate: tag(log, interval(0.01, 0.3))
      model_launcher.model.num_leaves: tag(log, int(interval(15, 511)))
      model_launcher.model.min_child_samples: tag(log, int(interval(5, 500)))
      # GOSS is on, so bagging_fraction is unused: tune the sampled share of the rest instead (0.4-0.8 of the rows per
      # tree with goss_top 0.3, as bagging_fraction 0.5-1 covered).
      model_launcher.model.goss_other: interval(0.1, 0.5)
      model_launcher.model.lambda_l2: tag(log, interval(0.001, 10))
      tabularization.min_code_inclusion_count: tag(log, int(interval(10, 1000000)))
