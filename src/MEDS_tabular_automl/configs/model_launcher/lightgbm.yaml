# @package _global_
defaults:
  - default
  - _self_

model_launcher:
  _target_: MEDS_tabular_automl.lightgbm_model.LightGBMModel.initialize

  model:
    objective: binary
    metric: binary_logloss
    boosting_type: gbdt
    # `gpu` (OpenCL) works with the pip wheels on Linux and Windows given an OpenCL runtime (NVIDIA and AMD
    # drivers include one); `cuda` needs a source build (`pip install lightgbm --no-binary lightgbm
    # --config-settings=cmake.define.USE_CUDA=ON`).
    device_type: cpu
    # 0 uses OpenMP's default: every CPU in a single run. Under `--multirun`, the joblib launcher starts its
    # workers with OMP_NUM_THREADS=cpu_count/hydra.launcher.n_jobs (1 by default), so set this explicitly.
    num_threads: 0
    # LightGBM's GPU guide recommends 63 bins ("usually does not noticeably affect training accuracy on large
    # datasets"); on CPU it reports only a marginal speedup. Count features have fewer distinct values than
    # this anyway (LightGBM never uses more bins than distinct values), so it only coarsens value features.
    max_bin: 63
    # Recommended by LightGBM when "the number of columns is large" (CPU only; ignored on GPU).
    force_col_wise: true
    bagging_freq: 1
    seed: ${seed}
    verbosity: -1

  training_params:
    num_boost_round: 1000
    early_stopping_rounds: 5

path:
  model_file_stem: "lightgbm"
  model_file_extension: .txt

hydra:
  sweeper:
    params:
      +model_launcher.model.learning_rate: tag(log, interval(0.005, 0.3))
      +model_launcher.model.num_leaves: tag(log, int(interval(15, 1023)))
      +model_launcher.model.min_child_samples: tag(log, int(interval(5, 500)))
      +model_launcher.model.feature_fraction: interval(0.1, 1)
      +model_launcher.model.bagging_fraction: interval(0.5, 1)
      +model_launcher.model.lambda_l1: tag(log, interval(0.001, 10))
      +model_launcher.model.lambda_l2: tag(log, interval(0.001, 10))
      model_launcher.training_params.num_boost_round: range(100, 1000)
      model_launcher.training_params.early_stopping_rounds: range(1, 10)
      tabularization.min_code_inclusion_count: tag(log, int(interval(10, 1000000)))
