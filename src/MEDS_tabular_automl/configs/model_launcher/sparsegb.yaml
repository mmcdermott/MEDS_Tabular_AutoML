# @package _global_
defaults:
  - default
  - _self_

model_launcher:
  _target_: MEDS_tabular_automl.sparsegb_model.SparseGBModel.initialize

  # sparsegb (MEDS_tabular_automl.sparsegb): binary gradient-boosted trees for wide, sparse tabularized data.
  # Needs the compiled library (installed from source with a C++17 compiler and OpenMP).
  model:
    # 0: every CPU. Under `--multirun`, set hydra.launcher.n_jobs=1 so trials do not share the CPUs.
    threads: 0
    max_bin: 15
    num_leaves: 127
    min_child_samples: 50
    lambda_l2: 1.0
    learning_rate: 0.05
    bagging_fraction: 0.8
    max_rounds: 1000
    early_stopping: 20
    seed: ${seed}
    min_sum_hessian: 0.001
    # Column sampling: each tree uses one window per (code, aggregation), drawn from `layouts` precomputed layouts
    # (a multiple of 7; 0 draws a fresh sample every `refresh` trees instead).
    layouts: 14
    refresh: 1

path:
  model_file_stem: "sparsegb"
  model_file_extension: .txt

hydra:
  sweeper:
    params:
      model_launcher.model.learning_rate: tag(log, interval(0.01, 0.3))
      model_launcher.model.num_leaves: tag(log, int(interval(15, 511)))
      model_launcher.model.min_child_samples: tag(log, int(interval(5, 500)))
      model_launcher.model.bagging_fraction: interval(0.5, 1)
      model_launcher.model.lambda_l2: tag(log, interval(0.001, 10))
      tabularization.min_code_inclusion_count: tag(log, int(interval(10, 1000000)))
